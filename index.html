<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Digital Twin - ESP32 3D Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    
    <!-- Tải thư viện Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    
    <!-- Tải thư viện Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* Giao diện Bảng hiển thị thông số ESP32 */
        .telemetry-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 10;
            min-width: 200px;
        }
        .telemetry-panel h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        .data-row { margin-bottom: 8px; font-size: 14px; color: #555; }
        .data-value { font-weight: bold; color: #000; }
        #status { font-weight: bold; color: red; }
    </style>
</head>
<body>

<!-- Khung chứa bản đồ -->
<div id="map"></div>

<!-- Bảng hiển thị dữ liệu trực tiếp -->
<div class="telemetry-panel">
    <h3>📡 Trạm điều khiển ESP32</h3>
    <div class="data-row">Server: <span id="status">Đang kết nối...</span></div>
    <div class="data-row">Lat: <span class="data-value" id="lat">--</span></div>
    <div class="data-row">Lng: <span class="data-value" id="lng">--</span></div>
    <div class="data-row">Yaw: <span class="data-value" id="yaw">--</span>°</div>
</div>

<script>
    // ==============================================================
    // 1. CẤU HÌNH MAPBOX 3D (Hãy dán Access Token của bạn vào đây)
    // ==============================================================
    mapboxgl.accessToken = 'BẠN_ĐIỀN_TOKEN_MAPBOX_CỦA_BẠN_VÀO_ĐÂY';
    
    // Khởi tạo bản đồ lấy tâm là tọa độ mặc định trong ESP32
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12', 
        center: [105.854200, 21.028500], 
        zoom: 18,
        pitch: 60, // Góc nghiêng 3D
        bearing: 0,
        antialias: true
    });

    // Tạo Marker (điểm định vị) đại diện cho mạch ESP32
    const espMarker = new mapboxgl.Marker({ color: '#ff0000' })
        .setLngLat([105.854200, 21.028500])
        .addTo(map);

    // Kích hoạt layer tòa nhà 3D
    map.on('load', () => {
        map.addLayer({
            'id': '3d-buildings',
            'source': 'composite',
            'source-layer': 'building',
            'filter': ['==', 'extrude', 'true'],
            'type': 'fill-extrusion',
            'minzoom': 15,
            'paint': {
                'fill-extrusion-color': '#aaa',
                'fill-extrusion-height': ['get', 'height'],
                'fill-extrusion-base': ['get', 'min_height'],
                'fill-extrusion-opacity': 0.6
            }
        });
    });

    // ==============================================================
    // 2. KẾT NỐI SOCKET.IO SERVER & LẮNG NGHE DỮ LIỆU
    // ==============================================================
    const socket = io("https://checkgps.onrender.com");

    // Lấy các thẻ HTML để hiển thị số liệu
    const statusEl = document.getElementById('status');
    const latEl = document.getElementById('lat');
    const lngEl = document.getElementById('lng');
    const yawEl = document.getElementById('yaw');

    // Bắt sự kiện kết nối Server
    socket.on("connect", () => {
        statusEl.innerText = "🟢 Đã kết nối";
        statusEl.style.color = "green";
    });

    socket.on("disconnect", () => {
        statusEl.innerText = "🔴 Mất kết nối";
        statusEl.style.color = "red";
    });

    // Lắng nghe gói dữ liệu 'telemetry-update' được Server broadcast xuống
    socket.on('telemetry-update', (data) => {
        // Trích xuất tọa độ từ chuỗi JSON của ESP32
        const lat = data.sensors.gps.lat;
        const lng = data.sensors.gps.lon;
        const yaw = data.sensors.compass.yaw;

        // 1. In số liệu lên bảng theo thời gian thực
        latEl.innerText = lat.toFixed(6);
        lngEl.innerText = lng.toFixed(6);
        yawEl.innerText = yaw.toFixed(1);

        // 2. Cập nhật vị trí và góc xoay của Marker đỏ
        espMarker.setLngLat([lng, lat]);
        espMarker.setRotation(yaw);

        // 3. Tự động di chuyển góc nhìn của bản đồ (Camera) mượt mà bám theo Marker
        map.easeTo({
            center: [lng, lat],
            bearing: yaw,      // Bản đồ sẽ xoay theo hướng di chuyển
            duration: 1000,    // Thời gian trượt khớp với tốc độ gửi 1s/lần của mạch
            easing: (t) => t   // Chuyển động tuyến tính
        });
    });
</script>
</body>
</html>
