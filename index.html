<!DOCTYPE html>
<html>
<head>
    <title>Ban do Dinh vi ESP32</title>
    <!-- Tải thư viện bản đồ Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style> #map { height: 100vh; width: 100%; margin: 0; padding: 0; } body { margin: 0; } </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Khởi tạo bản đồ
        var map = L.map('map').setView([21.0285, 105.8542], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        var marker = L.marker([21.0285, 105.8542]).addTo(map);

        // Liên tục cập nhật vị trí mỗi 3 giây
        setInterval(() => {
            fetch('/api/current-location')
                .then(res => res.json())
                .then(data => {
                    var newLatLng = new L.LatLng(data.lat, data.lng);
                    marker.setLatLng(newLatLng);
                    map.panTo(newLatLng);
                });
        }, 3000);
    </script>
</body>
</html>
