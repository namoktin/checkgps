<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Digital Twin 2D - ESP32 Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    
    <!-- Tải thư viện bản đồ Leaflet.js MIỄN PHÍ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Tải thư viện Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; }
        
        /* Giao diện Bảng hiển thị thông số */
        .telemetry-panel {
            position: absolute;
            top: 15px;
            left: 55px; /* Dịch sang phải một chút để tránh nút Zoom của Leaflet */
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 10;
            min-width: 200px;
        }
        .telemetry-panel h3 { margin: 0 0 10px 0; font-size: 16px; color: #333; }
        .data-row { margin-bottom: 8px; font-size: 14px; color: #555; }
        .data-value { font-weight: bold; color: #000; }
        #status { font-weight: bold; color: red; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="telemetry-panel">
    <h3>📡 Trạm điều khiển ESP32</h3>
    <div class="data-row">Server: <span id="status">Đang kết nối...</span></div>
    <div class="data-row">Lat: <span class="data-value" id="lat">--</span></div>
    <div class="data-row">Lng: <span class="data-value" id="lng">--</span></div>
    <div class="data-row">Yaw: <span class="data-value" id="yaw">--</span>°</div>
</div>

<script>
    // ==============================================================
    // 1. CẤU HÌNH BẢN ĐỒ LEAFLET (Không cần Key)
    // ==============================================================
    // Khởi tạo bản đồ ở tọa độ Hỏa Lò
    const map = L.map('map').setView([21.028500, 105.854200], 18);

    // Kéo dữ liệu ảnh bản đồ từ OpenStreetMap (Hoàn toàn miễn phí)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Tạo Marker (Điểm định vị đỏ) đại diện cho mạch ESP32
    // Leaflet mặc định dùng hình giọt nước xanh, ta dùng hàm setLatLng để dịch chuyển nó
    const espMarker = L.marker([21.028500, 105.854200]).addTo(map);

    // ==============================================================
    // 2. KẾT NỐI SOCKET.IO SERVER & LẮNG NGHE DỮ LIỆU
    // ==============================================================
    const socket = io("https://checkgps.onrender.com");

    const statusEl = document.getElementById('status');
    const latEl = document.getElementById('lat');
    const lngEl = document.getElementById('lng');
    const yawEl = document.getElementById('yaw');

    socket.on("connect", () => {
        statusEl.innerText = "🟢 Đã kết nối";
        statusEl.style.color = "green";
    });

    socket.on("disconnect", () => {
        statusEl.innerText = "🔴 Mất kết nối";
        statusEl.style.color = "red";
    });

    // Lắng nghe dữ liệu
    socket.on('telemetry-update', (data) => {
        const lat = data.sensors.gps.lat;
        const lng = data.sensors.gps.lon;
        const yaw = data.sensors.compass.yaw;

        // Cập nhật bảng số liệu
        latEl.innerText = lat.toFixed(6);
        lngEl.innerText = lng.toFixed(6);
        yawEl.innerText = yaw.toFixed(1);

        // Di chuyển Marker trên bản đồ (Lưu ý Leaflet dùng mảng [Vĩ độ, Kinh độ])
        const newLatLng = new L.LatLng(lat, lng);
        espMarker.setLatLng(newLatLng);

        // Kéo màn hình đi theo Marker mượt mà
        map.panTo(newLatLng);
    });
</script>
</body>
</html>
